# Taxonomía biológica — orquestación Docker (Integrante D)
# Solo app (memoria):  docker compose up --build
# App + BDs:           docker compose --profile db up --build

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-16}
    container_name: taxonomia_postgres
    profiles:
      - db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taxonomia_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./taxonomia-api/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./taxonomia-api/src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-taxonomia_db}"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks:
      - taxonomia_network

  neo4j:
    image: neo4j:${NEO4J_VERSION:-5}
    container_name: taxonomia_neo4j
    profiles:
      - db
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
    ports:
      - "${NEO4J_BOLT_PORT:-7687}:7687"
      - "${NEO4J_HTTP_PORT:-7474}:7474"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-password} 'RETURN 1'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - taxonomia_network

  mongodb:
    image: mongo:${MONGO_VERSION:-7}
    container_name: taxonomia_mongodb
    profiles:
      - db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-password}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-taxonomia_db}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "-u",
          "${MONGO_INITDB_ROOT_USERNAME:-admin}",
          "-p",
          "${MONGO_INITDB_ROOT_PASSWORD:-password}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - taxonomia_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taxonomia_app
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    environment:
      SERVER_PORT: ${APP_PORT:-8080}
      SPRING_APPLICATION_NAME: ${SPRING_APPLICATION_NAME:-taxonomia-api}
      APP_TREE_STRATEGY: ${APP_TREE_STRATEGY:-custom}
      APP_STORAGE: ${APP_STORAGE:-memory}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/taxonomia_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_NEO4J_URI: ${SPRING_NEO4J_URI:-bolt://neo4j:7687}
      SPRING_NEO4J_AUTHENTICATION_USERNAME: ${NEO4J_USER:-neo4j}
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: ${NEO4J_PASSWORD:-password}
      SPRING_DATA_MONGODB_URI: ${SPRING_DATA_MONGODB_URI:-mongodb://admin:password@mongodb:27017/taxonomia_db?authSource=admin}
      JAVA_OPTS: ${JAVA_OPTS:--Xms256m -Xmx512m}
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      neo4j:
        condition: service_healthy
        required: false
      mongodb:
        condition: service_healthy
        required: false
    networks:
      - taxonomia_network

volumes:
  postgres_data:
  neo4j_data:
  mongo_data:

networks:
  taxonomia_network:
    driver: bridge
