  /nodes/{nodeId}/depth:
    get:
      tags:
        - nodes
      summary: Obtener profundidad del nodo
      operationId: getDepth

      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      responses:
        "200":
          description: Profundidad encontrada
          content:
            application/json:
              schema:
                type: integer

  /nodes/{nodeId}/ancestors:
    get:
      tags:
        - nodes
      summary: Obtener ancestros
      operationId: getAncestors

      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      responses:
        "200":
          description: Lista de ancestros
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TreeNodeDTO'

  /nodes/{nodeId}/path:
    get:
      tags:
        - nodes
      summary: Ruta desde la raiz al nodo
      operationId: getPathToNode

      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: integer
            format: int64

      responses:
        "200":
          description: Ruta encontrada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TreeNodeDTO'
        "404":
          $ref: '#/components/responses/NotFound'

  /nodes/{nodeId}:
    delete:
      tags:
        - nodes
      summary: Eliminar nodo y su subarbol
      operationId: deleteNode
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Nodo eliminado
        "404":
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - nodes
      summary: Actualizar valor de un nodo
      operationId: updateNode
      parameters:
        - name: nodeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: value
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Nodo actualizado
          content:
            application/json:
              schema:
                type: boolean
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'

  /traversal/dfs:
    get:
      tags:
        - traversal
      summary: Recorrido DFS
      operationId: dfsTraversal

